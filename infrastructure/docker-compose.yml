services:
  postgres-animals:
    image: postgres:15-alpine
    container_name: caring-iggy-animals-db
    environment:
      POSTGRES_DB: animals_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-animals-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [db]

  postgres-users:
    image: postgres:15-alpine
    container_name: caring-iggy-users-db
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [db]

  postgres-adopters:
    image: postgres:15-alpine
    container_name: caring-iggy-adopters-db
    environment:
      POSTGRES_DB: adopters_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - postgres-adopters-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [db]

  animal-service:
    build:
      context: ../backend
      dockerfile: animal-service/Dockerfile
    container_name: caring-iggy-animal-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres-animals
      DB_PORT: 5432
      DB_NAME: animals_db
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_JWKS_URI: http://user-service:8085/.well-known/jwks.json
    depends_on:
      postgres-animals:
        condition: service_healthy
    networks: [backend, db]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  adopter-service:
    build:
      context: ../backend
      dockerfile: adopter-service/Dockerfile
    container_name: caring-iggy-adopter-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres-adopters
      DB_PORT: 5432
      DB_NAME: adopters_db
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_JWKS_URI: http://user-service:8085/.well-known/jwks.json
    depends_on:
      postgres-adopters:
        condition: service_healthy
    networks: [backend, db]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    build:
      context: ../backend
      dockerfile: user-service/Dockerfile
    container_name: caring-iggy-user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres-users
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      ADOPTER_SERVICE_URL: ${ADOPTER_SERVICE_URL:-http://adopter-service:8082}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_KEY_ID: ${JWT_KEY_ID:-ci-key-1}
    depends_on:
      postgres-users:
        condition: service_healthy
    networks: [backend, db]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  matching-service:
    build:
      context: ../backend
      dockerfile: matching-service/Dockerfile
    container_name: caring-iggy-matching-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ANIMAL_SERVICE_URL: ${ANIMAL_SERVICE_URL:-http://animal-service:8081}
      ADOPTER_SERVICE_URL: ${ADOPTER_SERVICE_URL:-http://adopter-service:8082}
      JWT_JWKS_URI: http://user-service:8085/.well-known/jwks.json
    depends_on:
      - animal-service
      - adopter-service
    networks: [backend, db]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  reporting-service:
    build:
      context: ../backend
      dockerfile: reporting-service/Dockerfile
    container_name: caring-iggy-reporting-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ANIMAL_SERVICE_URL: ${ANIMAL_SERVICE_URL:-http://animal-service:8081}
      ADOPTER_SERVICE_URL: ${ADOPTER_SERVICE_URL:-http://adopter-service:8082}
      JWT_JWKS_URI: http://user-service:8085/.well-known/jwks.json
    depends_on:
      - animal-service
      - adopter-service
    networks: [backend, db]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # frontend:
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #   container_name: caring-iggy-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     ANIMAL_SERVICE_URL: ${ANIMAL_SERVICE_URL:-http://animal-service:8081}
  #     USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8085}
  #     ADOPTER_SERVICE_URL: ${ADOPTER_SERVICE_URL:-http://adopter-service:8082}
  #   volumes:
  #     - ../frontend/src:/app/src:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  kong:
    image: kong:3.6
    container_name: caring-iggy-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_TRUSTED_IPS: 0.0.0.0/0        # dev: trust XFF; TIGHTEN to BFF subnet in prod
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
    networks: [public, backend]
    depends_on:
      user-service:
        condition: service_healthy
      animal-service:
        condition: service_healthy
      adopter-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-animals-data:
  postgres-users-data:
  postgres-adopters-data:

networks:
  public:
    name: caring-iggy-public
  backend:
    name: caring-iggy-backend
  db:
    name: caring-iggy-db
