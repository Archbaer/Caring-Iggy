server:
  port: 8084

spring:
  application:
    name: reporting-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8085/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.caringiggy: DEBUG
