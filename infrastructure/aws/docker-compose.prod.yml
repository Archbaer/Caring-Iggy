x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-java-runtime: &java-runtime
  <<: *runtime
  mem_limit: 448m
  pids_limit: 256
  environment: &java-environment
    JAVA_TOOL_OPTIONS: >-
      -XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0
      -XX:+ExitOnOutOfMemoryError
    LOGGING_LEVEL_COM_CARINGIGGY: INFO
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info

x-java-healthcheck: &java-healthcheck
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 90s

name: caring-iggy

services:
  caddy:
    <<: *runtime
    image: caddy:2.11.4@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
    platform: linux/amd64
    mem_limit: 96m
    pids_limit: 128
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.template:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    <<: *runtime
    image: ${DOCKER_IMAGE_PREFIX:?DOCKER_IMAGE_PREFIX is required}-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    mem_limit: 384m
    pids_limit: 256
    env_file:
      - ${RUNTIME_DIR:-/run/caring-iggy}/frontend.env
    environment:
      KONG_URL: http://kong:8000
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      TRUST_PROXY_HEADERS: "true"
      AUTH_SESSION_COOKIE_SECURE: "true"
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      kong:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kong:
    <<: *runtime
    image: kong:3.9.3@sha256:d56dba2a916b7bb842ec0b5caae3e0956b18afc10119ea90203a41650c01f7c9
    platform: linux/amd64
    mem_limit: 512m
    pids_limit: 256
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_TRUSTED_IPS: 172.30.0.0/24
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_NGINX_WORKER_PROCESSES: "1"
    volumes:
      - ${RUNTIME_DIR:-/run/caring-iggy}/kong.yml:/kong/kong.yml:ro
    depends_on:
      animal-service:
        condition: service_healthy
      adopter-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  animal-service:
    <<: *java-runtime
    image: ${DOCKER_IMAGE_PREFIX:?DOCKER_IMAGE_PREFIX is required}-animal-service:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - ${RUNTIME_DIR:-/run/caring-iggy}/animal-service.env
    environment:
      <<: *java-environment
      DB_HOST: ${RDS_ENDPOINT:?RDS_ENDPOINT is required}
      DB_PORT: "5432"
      DB_NAME: animals_db
      DB_SSLMODE: require
      DB_POOL_MAX: "5"
      DB_POOL_MIN_IDLE: "1"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      JWT_JWKS_URI: http://user-service:8085/.well-known/jwks.json
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC: INFO
    networks: [backend]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]

  adopter-service:
    <<: *java-runtime
    image: ${DOCKER_IMAGE_PREFIX:?DOCKER_IMAGE_PREFIX is required}-adopter-service:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - ${RUNTIME_DIR:-/run/caring-iggy}/adopter-service.env
    environment:
      <<: *java-environment
      DB_HOST: ${RDS_ENDPOINT:?RDS_ENDPOINT is required}
      DB_PORT: "5432"
      DB_NAME: adopters_db
      DB_SSLMODE: require
      DB_POOL_MAX: "5"
      DB_POOL_MIN_IDLE: "1"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      JWT_JWKS_URI: http://user-service:8085/.well-known/jwks.json
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC: INFO
    networks: [backend]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health"]

  user-service:
    <<: *java-runtime
    image: ${DOCKER_IMAGE_PREFIX:?DOCKER_IMAGE_PREFIX is required}-user-service:${IMAGE_TAG:?IMAGE_TAG is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export JWT_PRIVATE_KEY="$$(printf '%s' "$${JWT_PRIVATE_KEY_BASE64:?JWT_PRIVATE_KEY_BASE64 is required}" | base64 -d)"
        export JWT_PUBLIC_KEY="$$(printf '%s' "$${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 is required}" | base64 -d)"
        exec java -jar app.jar
    env_file:
      - ${RUNTIME_DIR:-/run/caring-iggy}/user-service.env
    environment:
      <<: *java-environment
      DB_HOST: ${RDS_ENDPOINT:?RDS_ENDPOINT is required}
      DB_PORT: "5432"
      DB_NAME: users_db
      DB_SSLMODE: require
      DB_POOL_MAX: "5"
      DB_POOL_MIN_IDLE: "1"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      ADOPTER_SERVICE_URL: http://adopter-service:8082
      AUTH_SESSION_COOKIE_SECURE: "true"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC: INFO
    depends_on:
      adopter-service:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/actuator/health"]

  matching-service:
    <<: *java-runtime
    image: ${DOCKER_IMAGE_PREFIX:?DOCKER_IMAGE_PREFIX is required}-matching-service:${IMAGE_TAG:?IMAGE_TAG is required}
    mem_limit: 384m
    environment:
      <<: *java-environment
      ANIMAL_SERVICE_URL: http://animal-service:8081
      ADOPTER_SERVICE_URL: http://adopter-service:8082
      JWT_JWKS_URI: http://user-service:8085/.well-known/jwks.json
    depends_on:
      animal-service:
        condition: service_healthy
      adopter-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]

  reporting-service:
    <<: *java-runtime
    image: ${DOCKER_IMAGE_PREFIX:?DOCKER_IMAGE_PREFIX is required}-reporting-service:${IMAGE_TAG:?IMAGE_TAG is required}
    mem_limit: 384m
    environment:
      <<: *java-environment
      ANIMAL_SERVICE_URL: http://animal-service:8081
      ADOPTER_SERVICE_URL: http://adopter-service:8082
      JWT_JWKS_URI: http://user-service:8085/.well-known/jwks.json
    depends_on:
      animal-service:
        condition: service_healthy
      adopter-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health"]

volumes:
  caddy-data:
  caddy-config:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
