name: CI Build and Test

on:
  push:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  java-quality:
    name: Java Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/**/pom.xml'

      - name: Run Checkstyle and SpotBugs
        run: mvn -B -DskipTests verify

  typescript-quality:
    name: TypeScript Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Run TypeScript checks
        working-directory: frontend
        run: npm run typecheck

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:unit

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE animals_db;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE adopters_db;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE users_db;"

      - name: Build with Maven
        run: mvn -B clean package -DskipTests
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Run Tests
        run: mvn test
        env:
          MAVEN_OPTS: -Xmx1024m
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: 'backend/**/target/surefire-reports/*.xml'

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Bootstrap JWT keypair (user-service + Kong)
        run: bash infrastructure/kong/bootstrap-keys.sh

      - name: Start backend stack
        run: docker compose -f infrastructure/docker-compose.yml up -d --build --wait kong
        timeout-minutes: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        working-directory: frontend
        run: npx playwright test --project=setup --project=api
        env:
          CI: true
          KONG_URL: http://localhost:8000
          INTERNAL_BASE_URL: http://localhost:3000
          APP_ORIGIN: http://localhost:3000
          AUTH_SESSION_STATE_SECRET: ci-test-session-secret-long-enough-for-ci
          AUTH_CSRF_SECRET: ci-test-csrf-secret-long-enough-for-ci

      # Runs last: the login rate-limit test burns the per-minute login window,
      # which would 429 any suite that logs in afterwards.
      - name: Run gateway tests
        working-directory: frontend
        run: npx playwright test --project=infra
        env:
          CI: true
          KONG_URL: http://localhost:8000
          INTERNAL_BASE_URL: http://localhost:3000
          APP_ORIGIN: http://localhost:3000
          AUTH_SESSION_STATE_SECRET: ci-test-session-secret-long-enough-for-ci
          AUTH_CSRF_SECRET: ci-test-csrf-secret-long-enough-for-ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs

  infrastructure-validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq
          jq --version
          compose_version=$(docker compose version --short)
          compose_version=${compose_version#v}
          IFS=. read -r compose_major compose_minor _ <<<"$compose_version"
          if ((compose_major < 2 || (compose_major == 2 && compose_minor < 30))); then
            echo "Docker Compose 2.30 or later required; found $compose_version" >&2
            exit 1
          fi

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint shell scripts
        run: |
          shopt -s nullglob
          scripts=(
            infrastructure/aws/*.sh
            infrastructure/aws/tests/*.sh
            infrastructure/aws/load/*.sh
          )
          if ((${#scripts[@]} > 0)); then
            shellcheck "${scripts[@]}"
          fi

      - name: Syntax-check shell scripts
        run: |
          shopt -s nullglob
          scripts=(
            infrastructure/aws/*.sh
            infrastructure/aws/tests/*.sh
            infrastructure/aws/load/*.sh
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done

      - name: Lint CloudFormation template
        run: cfn-lint -r eu-west-2 -t infrastructure/aws/template.yml

      - name: Run AWS deployment contract tests
        run: |
          for test in infrastructure/aws/tests/*.test.sh; do
            bash "$test"
          done

      - name: Scan Caddy base image
        # Trivy action v0.36.0 pinned to immutable commit
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: caddy:2.11.4@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan Kong base image
        # Trivy action v0.36.0 pinned to immutable commit
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: kong:3.9.3@sha256:d56dba2a916b7bb842ec0b5caae3e0956b18afc10119ea90203a41650c01f7c9
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
