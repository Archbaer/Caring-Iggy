server:
  port: 8085

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:users_db}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      adopterClient:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      adopterClient:
        timeoutDuration: 5s

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,circuitbreakers}
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.caringiggy: ${LOGGING_LEVEL_COM_CARINGIGGY:DEBUG}
    org.springframework.jdbc: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC:DEBUG}

# (env-provided; documented here)
# JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, JWT_KEY_ID=ci-key-1

auth:
  session:
    ttl: ${AUTH_SESSION_TTL:PT168H}
    cookie-secure: ${AUTH_SESSION_COOKIE_SECURE:false}

services:
  adopter:
    url: ${ADOPTER_SERVICE_URL:http://localhost:8082}
